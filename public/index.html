<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resale Scanner - Find Profitable Items to Flip</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .subtitle {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .search-section {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 40px;
    }

    .search-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 15px;
      margin-bottom: 20px;
    }

    input {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .listing-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .listing-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .card-header {
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .card-header h3 {
      margin-bottom: 8px;
      font-size: 1.2em;
    }

    .platform {
      display: inline-block;
      background: rgba(255,255,255,0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
    }

    .card-body {
      padding: 20px;
    }

    .price-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .price-item {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 5px;
    }

    .price-label {
      font-size: 0.9em;
      color: #666;
      margin-bottom: 5px;
    }

    .price-value {
      font-size: 1.3em;
      font-weight: bold;
      color: #667eea;
    }

    .analyze-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      margin-bottom: 10px;
      transition: transform 0.2s;
    }

    .analyze-btn:hover {
      transform: translateY(-2px);
    }

    .view-link {
      display: block;
      text-align: center;
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    .view-link:hover {
      color: #764ba2;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-header {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }

    .analysis-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .analysis-item:last-child {
      border-bottom: none;
    }

    .analysis-label {
      color: #666;
    }

    .analysis-value {
      font-weight: bold;
      color: #667eea;
    }

    .recommendation {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1em;
    }

    .recommendation.buy {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .recommendation.maybe {
      background: #fff3cd;
      color: #856404;
      border: 2px solid #ffc107;
    }

    .recommendation.pass {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }

    .close-btn {
      float: right;
      font-size: 1.5em;
      cursor: pointer;
      background: none;
      border: none;
      color: #666;
      padding: 0;
    }

    .close-btn:hover {
      color: #000;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 1.1em;
      padding: 40px;
    }

    @media (max-width: 768px) {
      .search-inputs {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 2em;
      }

      .listings-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛒 Resale Scanner</h1>
      <p class="subtitle">Find profitable items to flip on Facebook Marketplace & Craigslist</p>
    </header>

    <div class="search-section">
      <div class="search-inputs">
        <input type="text" id="searchInput" placeholder="Search (e.g., vintage, camera, laptop)">
        <input type="text" id="locationInput" placeholder="Location (optional)">
        <input type="number" id="maxPriceInput" placeholder="Max price (optional)">
        <button onclick="searchListings()">Search</button>
      </div>
    </div>

    <div class="listings-grid" id="listingsGrid"></div>
  </div>

  <!-- Modal for profit analysis -->
  <div class="modal" id="analysisModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">×</button>
      <div class="modal-header" id="modalTitle">Profit Analysis</div>
      <div id="analysisContent"></div>
    </div>
  </div>

  <script>
    let allListings = [];

    // Load listings on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadListings();
    });

    async function loadListings() {
      try {
        const response = await fetch('/api/listings');
        allListings = await response.json();
        displayListings(allListings);
      } catch (error) {
        console.error('Error loading listings:', error);
      }
    }

    function displayListings(listings) {
      const grid = document.getElementById('listingsGrid');
      grid.innerHTML = '';

      listings.forEach(listing => {
        const card = document.createElement('div');
        card.className = 'listing-card';
        card.innerHTML = `
          <div class="card-header">
            <h3>${listing.title}</h3>
            <span class="platform">${listing.platform}</span>
          </div>
          <div class="card-body">
            <div class="price-info">
              <div class="price-item">
                <div class="price-label">💰 Buy Price</div>
                <div class="price-value">$${listing.price}</div>
              </div>
              <div class="price-item">
                <div class="price-label">📍 Location</div>
                <div class="price-value">${listing.location}</div>
              </div>
            </div>
            <p style="color: #666; margin-bottom: 15px; font-size: 0.95em;">${listing.description}</p>
            <button class="analyze-btn" onclick="analyzeProfit(${listing.id})">Analyze Profit</button>
            <a href="${listing.url}" target="_blank" class="view-link">View Listing →</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function analyzeProfit(listingId) {
      const listing = allListings.find(l => l.id === listingId);
      
      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ listing })
        });
        const analysis = await response.json();
        showAnalysisModal(listing, analysis);
      } catch (error) {
        console.error('Error analyzing profit:', error);
      }
    }

    function showAnalysisModal(listing, analysis) {
      const modal = document.getElementById('analysisModal');
      const modalTitle = document.getElementById('modalTitle');
      const content = document.getElementById('analysisContent');

      modalTitle.textContent = `${listing.title}`;

      const recommendationClass = analysis.recommendation.toLowerCase();
      const recommendationEmoji = {
        'buy': '✅',
        'maybe': '⚠️',
        'pass': '❌'
      }[recommendationClass];

      content.innerHTML = `
        <div class="analysis-item">
          <span class="analysis-label">💵 Purchase Price</span>
          <span class="analysis-value">$${analysis.purchasePrice}</span>
        </div>
        <div class="analysis-item">
          <span class="analysis-label">📈 Estimated Resale</span>
          <span class="analysis-value">$${analysis.estimatedResale}</span>
        </div>
        <div class="analysis-item">
          <span class="analysis-label">📊 Resale Multiplier</span>
          <span class="analysis-value">${(analysis.estimatedResale / analysis.purchasePrice).toFixed(2)}x</span>
        </div>
        <div class="analysis-item">
          <span class="analysis-label">🏪 Platform Fee (12.5%)</span>
          <span class="analysis-value">-$${analysis.platformFee}</span>
        </div>
        <div class="analysis-item">
          <span class="analysis-label">📦 Shipping Cost</span>
          <span class="analysis-value">-$${analysis.shippingCost}</span>
        </div>
        <div class="analysis-item" style="border: 2px solid #667eea; padding: 12px; border-radius: 5px; margin-top: 15px;">
          <span class="analysis-label" style="font-weight: bold; color: #333;">💰 Net Profit</span>
          <span class="analysis-value" style="font-size: 1.3em;">$${analysis.netProfit}</span>
        </div>
        <div class="analysis-item">
          <span class="analysis-label">📊 Profit Margin</span>
          <span class="analysis-value">${analysis.profitMargin}%</span>
        </div>
        <div class="analysis-item">
          <span class="analysis-label">📂 Category</span>
          <span class="analysis-value">${analysis.category}</span>
        </div>
        <div class="recommendation ${recommendationClass}">
          ${recommendationEmoji} ${analysis.recommendation}
        </div>
      `;

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('analysisModal').classList.remove('active');
    }

    function searchListings() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const location = document.getElementById('locationInput').value.toLowerCase();
      const maxPrice = parseFloat(document.getElementById('maxPriceInput').value) || Infinity;

      const filtered = allListings.filter(listing => {
        const matchesSearch = !searchTerm || 
          listing.title.toLowerCase().includes(searchTerm) || 
          listing.description.toLowerCase().includes(searchTerm);
        
        const matchesLocation = !location || listing.location.toLowerCase().includes(location);
        
        const matchesPrice = listing.price <= maxPrice;

        return matchesSearch && matchesLocation && matchesPrice;
      });

      displayListings(filtered.length > 0 ? filtered : allListings);
    }

    // Close modal when clicking outside
    document.getElementById('analysisModal').addEventListener('click', (e) => {
      if (e.target.id === 'analysisModal') closeModal();
    });

    // Search on Enter key
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchListings();
    });
  </script>
</body>
</html>
